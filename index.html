<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171d29" />
    <title>Пианино на клавиатуре</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./piano.mjs"></script>
  </head>
  <body>
    <main class="piano" aria-labelledby="title">
      <header class="heading">
        <div>
          <p class="eyebrow">КАРМАННОЕ ПИАНИНО</p>
          <h1 id="title">Играй с клавиатуры</h1>
        </div>
        <span class="sound-mark" aria-label="Звук включён">♫</span>
      </header>
      <p class="hint">Нажимай клавиши или касайся пианино</p>
      <section class="octave" aria-label="Верхняя октава: Q W E R T Y U, чёрные 2 3 5 6 7">
        <div class="octave-heading"><span>ВЫШЕ</span><span>Q → U</span></div>
        <div class="keyboard" id="upper-keyboard"></div>
      </section>
      <section class="octave" aria-label="Нижняя октава: Z X C V B N M, чёрные S D G H J">
        <div class="octave-heading"><span>НИЖЕ</span><span>Z → M</span></div>
        <div class="keyboard" id="lower-keyboard"></div>
      </section>
      <p class="footer">Раскладка не влияет на ноты <span aria-hidden="true">✦</span> Можно играть аккордами</p>
    </main>
  </body>
</html>
